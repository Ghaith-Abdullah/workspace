<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif}
#bg{position:absolute;inset:0;width:1440px;height:1080px;object-fit:cover;display:none}
#panel{position:absolute;left:50%;top:58px;height:150px;border-radius:28px;overflow:hidden;
 background:rgba(16,16,18,.56);-webkit-backdrop-filter:blur(26px) saturate(1.35);backdrop-filter:blur(26px) saturate(1.35);
 border:1px solid rgba(255,255,255,.11);box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);opacity:0}
.wd{position:absolute;top:22px;font-size:58px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap;color:#fff;font-weight:400;opacity:0;transform-origin:50% 60%}
#wave{position:absolute;left:50%;top:96px;width:340px;height:42px;margin-left:-170px}
</style></head><body>
<img id="bg">
<div id="panel"><div id="words"></div><canvas id="wave" width="680" height="84"></canvas></div>
<script>
const LINES=[{"words": [["another", 3.65], ["month.", 4.29], ["same", 5.33], ["numbers.", 5.73]], "end": 6.3}, {"words": [["page", 11.8], ["four.", 12.067], ["nobody", 13.027], ["scrolls", 13.427], ["that", 13.827], ["far.", 14.067]], "end": 14.467, "pre": 11.02}, {"words": [["the", 15.0], ["team", 15.173], ["went", 15.413], ["quiet.", 15.613], ["so", 16.733], ["did", 16.893], ["the", 17.013], ["clients.", 17.133]], "end": 17.893}, {"words": [["out", 19.3], ["of", 19.5], ["ideas.", 19.62], ["again.", 20.74]], "end": 21.54, "pre": 18.42}];
const BANDS=BANDS_JSON;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const meas=document.createElement('span');meas.className='wd';meas.style.visibility='hidden';document.body.appendChild(meas);
function wid(t,w){meas.style.fontWeight=w;meas.textContent=t;return meas.getBoundingClientRect().width}
const SP=15, PADX=44, MINW=420;
let built=false;
function build(){LINES.forEach(L=>{let x=0;L.words.forEach((w,i)=>{w.w=wid(w[0],400);w.fit=Math.min(1,w.w/wid(w[0],640));w.x=x;x+=w.w+SP;});});built=true;}
window.ready=document.fonts.ready.then(()=>{build();return true});
function env(t){let a=0;LINES.forEach(L=>L.words.forEach(w=>{const st=w[1],d=w.dur,syl=w[2];if(t<st||t>st+d)return;const p=(t-st)/d;a=Math.max(a,Math.pow(Math.sin(Math.PI*p),.6)*(0.55+0.45*Math.abs(Math.sin(Math.PI*p*syl))))}));return a}
function rnd(i,k){const x=Math.sin(i*12.9898+k*78.233)*43758.5453;return x-Math.floor(x)}
function sn(i,t){const f=t*10,k=Math.floor(f),u=f-k,s=u*u*(3-2*u);return rnd(i,k)*(1-s)+rnd(i,k+1)*s}  // smooth per-bar noise
const cv=document.getElementById('wave'),cx=cv.getContext('2d'),wordsEl=document.getElementById('words'),pn=document.getElementById('panel');let cur=-1;
// visible width of a line when its first n words are shown
const vw=(L,n)=>n<=0?0:L.words[n-1].x+L.words[n-1].w;
function render(t){
  if(!built) build();
  const st0=L=>L.pre!==undefined?L.pre:L.words[0][1]-0.25;
  const li=LINES.findIndex(L=>t>=st0(L)&&t<=L.end+0.2);
  const vis=li<0?0:Math.min(clamp((t-st0(LINES[li]))/0.25),1-clamp((t-LINES[li].end)/0.2));
  pn.style.opacity=vis;
  if(li!==cur){cur=li;wordsEl.innerHTML=li<0?'':LINES[li].words.map(w=>`<span class="wd">${w[0]}</span>`).join('');}
  if(li<0) return;
  const L=LINES[li],els=wordsEl.children;
  // how many words shown; panel width eases to fit them (grows as words arrive, stays centred)
  let n=0,grow=1; L.words.forEach((w,i)=>{if(t>=w[1]-0.04){n=i+1;grow=eo((t-w[1]+0.04)/0.22)}});
  const textW=vw(L,L.words.length);   // final line width: words never move
  const PW=Math.max(MINW,textW+PADX*2);
  pn.style.width=PW+'px'; pn.style.marginLeft=(-PW/2)+'px';
  pn.style.transform=`scale(${0.96+0.04*vis})`;
  const x0=(PW-textW)/2;
  L.words.forEach((w,i)=>{
    const e=els[i],st=w[1],nx=L.words[i+1],nextSt=nx?nx[1]-0.04:99;
    if(t<st-0.04){e.style.opacity=0;return}
    const k=eo((t-st+0.04)/0.18), act=t<nextSt?1:0;            // newest word: gold + bold, hard switch back to white
    e.style.opacity=k; e.style.left=(x0+w.x)+'px';
    e.style.fontWeight=act?640:400; e.style.color=act?'rgb(217,169,73)':'#fff';
    e.style.transform=`translateY(${(1-k)*8}px) scaleX(${act?w.fit:1})`;
    e.style.width=w.w+'px'; e.style.textAlign='center';
  });
  // waveform: driven by the real voice, one bar per frequency band (low bands centred)
  cx.clearRect(0,0,680,84); const fi=Math.min(BANDS.length-1,Math.max(0,Math.round(t*30))); const row=BANDS[fi]; const N=row.length;
  for(let i=0;i<N;i++){
    const c=(i-(N-1)/2)/((N-1)/2), v=row[i];
    const h=Math.max(6,v*78);
    const x=340+c*318-4, y=42-h/2;
    cx.fillStyle=`rgba(255,255,255,${0.42+0.5*v})`;
    cx.beginPath();cx.roundRect(x,y,8,h,4);cx.fill();
  }
}
window.render=render;
window.setBg=src=>{const b=document.getElementById('bg');b.src=src;b.style.display='block';return new Promise(r=>b.onload=r)};
</script></body></html>
